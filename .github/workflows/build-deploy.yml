name: Build & Deploy

on:
  workflow_dispatch:
  schedule:
    # Nightly UTC rebuild
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify production site
        env:
          ZENODO_COMMUNITY: ${{ vars.ZENODO_COMMUNITY || 'clir' }}
          ZENODO_PAGE_SIZE: ${{ vars.ZENODO_PAGE_SIZE || '25' }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          SITE_URL: https://clirdlf.github.io/publications_v2/
          PATH_PREFIX: /
          GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
        run: pnpm run build:production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
